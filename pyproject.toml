[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelmux"
version = "0.3.0"
description = "A small local interface for running AI models from any frontend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
modelmux = "modelmux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmux"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]
