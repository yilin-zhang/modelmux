name: macos-say
task: tts
adapter: command
description: Dependency-free macOS TTS example; replace it with a model adapter when ready.
input:
  kind: text
  extension: .txt
output:
  kind: audio
  extension: .aiff
  media_type: audio/aiff
defaults:
  voice: Tingting
  rate: 180
capabilities:
  streaming: false
  voice: true
  speed: true
command:
  argv:
    - /usr/bin/say
    - -v
    - "{voice}"
    - -r
    - "{rate}"
    - -f
    - "{input_path}"
    - -o
    - "{output_path}"
